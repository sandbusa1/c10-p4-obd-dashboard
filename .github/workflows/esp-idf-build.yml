name: ESP-IDF 5.5.5 Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare git-pull firmware source
        shell: bash
        run: python3 prepare_source.py

      - name: Build ESP32-P4 firmware
        shell: bash
        working-directory: firmware
        run: |
          . /opt/esp/idf/export.sh
          python /opt/esp/idf/tools/idf.py set-target esp32p4
          python -c 'from pathlib import Path; s=Path("sdkconfig").read_text(); required=("CONFIG_LV_USE_CLIB_MALLOC=y", "CONFIG_SPIRAM_USE_MALLOC=y"); missing=[v for v in required if v not in s.splitlines()]; assert not missing, f"Required LVGL allocator settings missing: {missing}"'
          python /opt/esp/idf/tools/idf.py build

      - name: Collect firmware
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts/bootloader artifacts/partition_table
          cp firmware/build/bootloader/bootloader.bin artifacts/bootloader/
          cp firmware/build/partition_table/partition-table.bin artifacts/partition_table/
          cp firmware/build/*.bin artifacts/ || true
          cp firmware/build/*.elf artifacts/ || true
          cp firmware/build/flash_args artifacts/ || true
          cp firmware/build/flasher_args.json artifacts/ || true

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c10-p4-obd-gitpull-ready
          path: artifacts/
          if-no-files-found: error
