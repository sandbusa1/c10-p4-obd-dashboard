name: ESP-IDF 5.5.5 Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build ESP32-P4 firmware
        shell: bash
        run: |
          idf.py set-target esp32p4
          idf.py build
